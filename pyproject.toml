[project]
name = "field-triage-agent"
version = "0.1.0"
description = "Maintenance triage agent: LangGraph + LangSmith tracing + an eval harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langsmith>=0.3",
    "pydantic>=2.7",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# evals/ is a plain top-level package, not installed
pythonpath = ["."]
